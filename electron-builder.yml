appId: com.hush.app
productName: Hush
directories:
  output: dist
files:
  - out/**
  - package.json
# better-sqlite3 ships Node-API prebuilds for every platform (D-027), so nothing needs compiling, and a
# rebuild would fail when packaging Windows on a Mac (D-074).
npmRebuild: false
mac:
  target:
    - target: dmg
      arch: arm64
    # The in-app updater replaces the app from this zip; the dmg is for first installs.
    - target: zip
      arch: arm64
  icon: build/icon.icns
  category: public.app-category.education
  # Ad-hoc signing (no Developer ID): without it the bundle's signature is broken and a downloaded copy
  # says it is damaged; with it macOS only asks to allow an unidentified developer. Hardened runtime needs
  # a real identity, so it stays off.
  identity: '-'
  hardenedRuntime: false
dmg:
  artifactName: Hush-${version}-${arch}.${ext}
win:
  target:
    - target: nsis
      arch: x64
  icon: build/icon.ico
nsis:
  artifactName: Hush-${version}-setup.${ext}
